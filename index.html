<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f17">
  <title>MMB Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand"><span class="brand-icon">&#9654;</span>MMB <b>Player</b></div>
      <div id="searchBox" class="search-box" data-zone="search">
        <span class="search-icon">&#128269;</span>
        <input id="searchInput" type="text" placeholder="Search channels &ndash; press OK / Enter"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="stats"><span id="statChannels">0</span> channels &middot; <span id="statCategories">0</span> categories</div>
      <div id="clock" class="clock">--:--</div>
    </header>

    <!-- Three column layout -->
    <main class="layout">
      <section class="panel cat-panel">
        <div class="panel-title"><span id="catTitle">Categories</span></div>
        <div id="catList" class="vlist"></div>
      </section>

      <section class="panel ch-panel">
        <div class="panel-title"><span id="chTitle">Channels</span><span id="chCount" class="count"></span></div>
        <div id="chList" class="vlist"></div>
      </section>

      <section class="panel player-panel">
        <div id="playerBox" class="player-box" data-zone="player">
          <video id="video" playsinline webkit-playsinline preload="auto"></video>
          <div id="overlay" class="overlay">
            <div id="spinner" class="spinner"></div>
            <div id="overlayMsg" class="overlay-msg">Loading channels&hellip;</div>
          </div>
          <div id="osd" class="osd">
            <div id="osdNum" class="osd-num"></div>
            <div class="osd-body">
              <div id="osdName" class="osd-name"></div>
              <div id="osdMeta" class="osd-meta"></div>
            </div>
          </div>
        </div>

        <div class="channel-info">
          <div id="infoLogo" class="info-logo"></div>
          <div class="info-text">
            <div id="infoName" class="info-name">No channel selected</div>
            <div id="infoMeta" class="info-meta">Pick a channel from the list to start watching</div>
          </div>
        </div>

        <div class="hints">
          <span><i class="key">&#8593;&#8595;</i> Browse</span>
          <span><i class="key">OK</i> Play / Fullscreen</span>
          <span><i class="key red"></i> Favorite</span>
          <span><i class="key green"></i> Quality</span>
          <span><i class="key yellow"></i> Search</span>
          <span><i class="key">BACK</i> Return</span>
        </div>
      </section>
    </main>

    <!-- Status bar -->
    <footer class="statusbar">
      <div class="np"><span class="np-label">Now Playing:</span> <span id="npName">&mdash;</span></div>
      <div id="qualityNow" class="quality-now"></div>
      <div class="sb-right">
        <button id="qualityBtn" class="quality-btn" data-zone="quality" type="button">&#9881; Quality</button>
      </div>
    </footer>

    <!-- Quality menu -->
    <div id="qualityMenu" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title">Video quality</div>
        <div id="qualityList" class="modal-list"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="lib/hls.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vlist.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
